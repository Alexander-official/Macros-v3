<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <filter id="blur" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2080" height="1200"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/><stop offset=".5" stop-color="#ff7ad9"/><stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#070915"/>
    <g filter="url(#blur)" opacity=".85">
      <circle cx="170" cy="60" r="230" fill="#4f7bff"/>
      <circle cx="1120" cy="120" r="210" fill="#ff5fb7"/>
      <circle cx="640" cy="470" r="230" fill="#2ee6c8" opacity=".7"/>
      <circle cx="980" cy="420" r="140" fill="#ffb547" opacity=".55"/>
    </g>
    <!-- cam kart -->
    <rect x="120" y="70" width="1040" height="260" rx="34" fill="url(#glass)"/>
    <rect x="120.75" y="70.75" width="1038.5" height="258.5" rx="33.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
    <!-- logo -->
    <g transform="translate(190 130)">
      <rect width="140" height="140" rx="36" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".3"/>
      <path d="M80 18 L38 78 H66 L56 122 L102 58 H74 Z" fill="url(#bolt)"/>
    </g>
    <text x="370" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Macros <tspan fill="#8fd8ff">v3</tspan></text>
    <text x="372" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#dbe6ff" fill-opacity=".85">Marzban &amp; 3x-ui subscription merge &amp; management panel</text>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f4f7ff">
      <g transform="translate(372 262)">
        <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/><text x="80" y="22" text-anchor="middle">Multi-panel sync</text>
      </g>
      <g transform="translate(542 262)">
        <rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/><text x="59" y="22" text-anchor="middle">Xray JSON</text>
      </g>
      <g transform="translate(670 262)">
        <rect width="140" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/><text x="70" y="22" text-anchor="middle">Fallback subs</text>
      </g>
      <g transform="translate(820 262)">
        <rect width="134" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/><text x="67" y="22" text-anchor="middle">Liquid Glass</text>
      </g>
      <g transform="translate(964 262)">
        <rect width="166" height="34" rx="17" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".22"/><text x="83" y="22" text-anchor="middle">TR · EN · RU · TM</text>
      </g>
    </g>
    <text x="1140" y="370" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity=".7">by @alexvpns</text>
  </g>
</svg>
